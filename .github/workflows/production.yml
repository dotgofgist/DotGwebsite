name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_reason:
        description: Why is this production deployment being run?
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    working-directory: dotg-web

env:
  CI: "true"
  SUPABASE_TELEMETRY_DISABLED: "1"

jobs:
  production-deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment must be run from main."
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: dotg-web/.nvmrc
          cache: pnpm
          cache-dependency-path: dotg-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Production Supabase preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set SUPABASE_DB_URL_PRODUCTION to the production Supabase Session pooler connection string."
            exit 1
          fi
          pnpm run supabase:preflight
          pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Apply production migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}
        run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Pull Vercel production environment
        run: pnpm exec vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production
        run: pnpm exec vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy Vercel production
        id: deploy
        run: |
          url=$(pnpm exec vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tail -n 1)
          echo "$url" > deployment-url.txt
          echo "production-url=$url" >> "$GITHUB_OUTPUT"

      - name: Read-only production smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.production-url }}
          SMOKE_ALLOW_PRODUCTION: "true"
        run: pnpm run smoke:production

      - name: Deployment summary
        run: |
          echo "### Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ inputs.deploy_reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.production-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations: applied with supabase db push" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke: passed" >> "$GITHUB_STEP_SUMMARY"
