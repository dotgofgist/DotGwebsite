name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dotg-web

env:
  CI: "true"
  SUPABASE_TELEMETRY_DISABLED: "1"

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: dotg-web/.nvmrc
          cache: pnpm
          cache-dependency-path: dotg-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: pnpm run ci:static

  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: dotg-web/.nvmrc
          cache: pnpm
          cache-dependency-path: dotg-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker diagnostics
        run: docker info

      - name: Run local Supabase database checks
        run: pnpm run ci:database

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs:
      - static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: dotg-web/.nvmrc
          cache: pnpm
          cache-dependency-path: dotg-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: |
          pnpm exec supabase start > /dev/null
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          const status = JSON.parse(execFileSync('pnpm', ['exec', 'supabase', 'status', '--output', 'json'], { encoding: 'utf8' }));
          if (!status.API_URL || !status.ANON_KEY) throw new Error('Local Supabase public configuration is missing.');
          const result = spawnSync('pnpm', ['run', 'ci:build'], {
            stdio: 'inherit',
            env: { ...process.env, NEXT_PUBLIC_SUPABASE_URL: status.API_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: status.ANON_KEY },
          });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - static-checks
      - database-tests
      - production-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: dotg-web/.nvmrc
          cache: pnpm
          cache-dependency-path: dotg-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: |
          pnpm supabase start
          pnpm supabase db reset

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run local E2E
        run: pnpm run ci:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: dotg-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: dotg-web/test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup
